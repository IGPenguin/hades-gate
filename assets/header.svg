<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark, smoky background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0505;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0000;stop-opacity:1" />
    </linearGradient>

    <!-- Fiery text gradient -->
    <linearGradient id="fireGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffea00;stop-opacity:1" /> <!-- Yellow -->
      <stop offset="40%" style="stop-color:#ff8c00;stop-opacity:1" /> <!-- Orange -->
      <stop offset="80%" style="stop-color:#ff4500;stop-opacity:1" /> <!-- Red-Orange -->
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:1" /> <!-- Blood Red -->
    </linearGradient>

    <!-- Intense heat glow -->
    <filter id="heatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur3" />
      <feGaussianBlur stdDeviation="8" result="blur8" />
      <feGaussianBlur stdDeviation="15" result="blur15" />
      <feMerge>
        <feMergeNode in="blur15" />
        <feMergeNode in="blur8" />
        <feMergeNode in="blur3" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title { 
        fill: url(#fireGradient); 
        font-family: 'Georgia', serif; 
        font-size: 130px; 
        font-weight: 900; 
        letter-spacing: 12px; 
        text-transform: uppercase;
        filter: drop-shadow(0px 0px 10px #ff4500);
      }
      .hell-line {
        stroke: #4a0000;
        stroke-width: 4;
        opacity: 0.6;
      }
      @keyframes flicker {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.4; }
      }
      .spark {
        animation: flicker 2s infinite ease-in-out;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <!-- Decorative Hellish Borders -->
  <path d="M0 20 H1200" class="hell-line" stroke-dasharray="10,5" />
  <path d="M0 180 H1200" class="hell-line" stroke-dasharray="10,5" />
  
  <!-- Main Burning Text -->
  <text x="50%" y="105" dominant-baseline="central" text-anchor="middle" class="title" filter="url(#heatGlow)">Hades Gate</text>
  
  <!-- Burning Embers / Sparks -->
  <circle cx="150" cy="140" r="3" fill="#ffea00" class="spark" style="animation-delay: 0.2s" />
  <circle cx="220" cy="60" r="2" fill="#ff8c00" class="spark" style="animation-delay: 0.5s" />
  <circle cx="1000" cy="150" r="4" fill="#ff4500" class="spark" style="animation-delay: 0.8s" />
  <circle cx="1100" cy="40" r="2.5" fill="#ffea00" class="spark" style="animation-delay: 1.1s" />
  <circle cx="50" cy="100" r="2" fill="#ff4500" class="spark" style="animation-delay: 1.4s" />
  <circle cx="1150" cy="100" r="3" fill="#ff8c00" class="spark" style="animation-delay: 1.7s" />
  <circle cx="600" cy="30" r="1.5" fill="#ffffff" class="spark" opacity="0.8" />
  <circle cx="400" cy="170" r="2" fill="#ffea00" class="spark" />
  <circle cx="800" cy="170" r="2.5" fill="#ff4500" class="spark" style="animation-delay: 0.3s" />

</svg>
